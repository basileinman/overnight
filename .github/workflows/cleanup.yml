name: One-time cleanup of old release
on: push
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/releases/tags/build-44" --jq .id || true)
          [ -n "$id" ] && gh api -X DELETE "repos/$REPO/releases/$id" || true
          gh api -X DELETE "repos/$REPO/git/refs/tags/build-44" || true
